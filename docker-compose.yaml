services:
  postgres:
    image: postgres:latest
    container_name: budget-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_password
      POSTGRES_DB: budget_tracker
    ports:
      - "55433:5432"
    volumes:
      - budget_tracker_postgres_data:/var/lib/postgresql/data

volumes:
  budget_tracker_postgres_data: